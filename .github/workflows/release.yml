name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_SECRET: ${{ secrets.FIREBASE || secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_SECRET" ]; then
            echo "ERROR: Set the FIREBASE repository secret to the contents of google-services.json."
            exit 1
          fi
          TRIMMED="$(printf '%s' "$GOOGLE_SERVICES_SECRET" | sed -e 's/^[[:space:]]*//')"
          case "$TRIMMED" in
            \{*)
              printf '%s\n' "$GOOGLE_SERVICES_SECRET" > app/google-services.json
              ;;
            *)
              printf '%s' "$GOOGLE_SERVICES_SECRET" | tr -d '\r\n' | base64 --decode > app/google-services.json
              ;;
          esac
          python3 -c 'import json; d = json.load(open("app/google-services.json")); assert "project_info" in d' || {
            echo "ERROR: Secret did not contain valid google-services.json content (paste the file text starting with '{', not a shell command)."
            exit 1
          }

      - name: Decode AI Studio signing keystore
        run: tr -d '\r\n' < debug.keystore.base64 | base64 --decode > debug.keystore

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare unochess.apk
        run: cp app/build/outputs/apk/debug/app-debug.apk unochess.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: unochess-apk
          path: unochess.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: unochess.apk
          generate_release_notes: true
